spring.application.name=AgosPantay
server.address=${AGOSPANTAY_BIND:0.0.0.0}
server.port=${PORT:8080}
server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${AGOSPANTAY_DB_URL:jdbc:h2:file:./data/agospantay}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false

agospantay.admin-password=${AGOSPANTAY_ADMIN_PASSWORD:}
agospantay.seed-samples=${AGOSPANTAY_SEED_SAMPLES:true}
